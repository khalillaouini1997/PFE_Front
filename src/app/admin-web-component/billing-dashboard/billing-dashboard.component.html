<div class="billing-dashboard-container">
  <div class="billing-header">
    <div class="title-section">
      <h2>{{ 'BILLING_DASHBOARD.TITLE' | translate }}</h2>
      <p class="subtitle">{{ 'BILLING_DASHBOARD.SUBTITLE' | translate }}</p>
    </div>
  </div>

  <div class="metabase-wrapper">
    <iframe
      [src]="metabaseUrl"
      frameborder="0"
      allowtransparency
      class="metabase-iframe"
      title="Billing Analytics Dashboard">
    </iframe>
  </div>
</div>
