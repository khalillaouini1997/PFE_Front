<!-- Device Installation Evolution Chart - Full Width -->
<div class="evolution-chart-container">
  <div class="chart-card chart-card-full">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="m-0">Device Installation Evolution</h3>
      <select (change)="onGranularityChange($event)" aria-label="Chart granularity" class="form-select form-select-sm"
              id="granularitySelect" style="width: auto;">
        <option [selected]="granularity() === 'month'" value="month">Month</option>
        <option [selected]="granularity() === 'trimester'" value="trimester">Trimester</option>
        <option [selected]="granularity() === 'year'" value="year">Year</option>
      </select>
    </div>
    <div class="chart-wrapper">
      <canvas #evolutionChart></canvas>
    </div>
  </div>
</div>

<!-- Other 4 Charts in Grid -->
<div class="charts-container">
  <div class="chart-card">
    <h3>Vehicle Status</h3>
    <div class="chart-wrapper">
      <canvas #statusChart></canvas>
    </div>
  </div>
  <div class="chart-card">
    <h3>Speed Distribution</h3>
    <div class="chart-wrapper">
      <canvas #speedChart></canvas>
    </div>
  </div>
  <div class="chart-card">
    <h3>Sim Card Providers</h3>
    <div class="chart-wrapper">
      <canvas #puceChart></canvas>
    </div>
  </div>
  <div class="chart-card">
    <h3>Signal Quality</h3>
    <div class="chart-wrapper">
      <canvas #signalChart></canvas>
    </div>
  </div>
</div>
