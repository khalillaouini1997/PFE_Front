<!-- Device Installation Evolution Chart - Full Width -->
<div class="evolution-chart-container">
  <div class="chart-card chart-card-full">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="m-0">{{ 'DASHBOARD.DEVICE_INSTALLATION_EVOLUTION' | translate }}</h3>
      <select (change)="onGranularityChange($event)" aria-label="Chart granularity" class="form-select form-select-sm"
              id="granularitySelect" style="width: auto;">
        <option [selected]="granularity() === 'month'" value="month">{{ 'DASHBOARD.GRANULARITY_MONTH' | translate }}</option>
        <option [selected]="granularity() === 'trimester'" value="trimester">{{ 'DASHBOARD.GRANULARITY_TRIMESTER' | translate }}</option>
        <option [selected]="granularity() === 'year'" value="year">{{ 'DASHBOARD.GRANULARITY_YEAR' | translate }}</option>
      </select>
    </div>
    <div class="chart-wrapper">
      <canvas #evolutionChart></canvas>
    </div>
  </div>
</div>
