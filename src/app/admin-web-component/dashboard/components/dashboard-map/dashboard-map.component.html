<div class="map-wrapper">
  @if (isMapLoading()) {
    <div class="map-loading">
      <div class="map-loading-spinner"></div>
      <p>Loading map...</p>
    </div>
  }
  
  @if (hasMapError()) {
    <div class="map-error">
      <div class="map-error-icon">
        <i class="material-icons">map</i>
      </div>
      <h3>Map Unavailable</h3>
      <p>{{ mapError() }}</p>
      <button class="map-retry-btn" (click)="retryMapLoad()" type="button">
        <i class="material-icons">refresh</i>
        <span>Retry</span>
      </button>
    </div>
  }
  
  <div #mapContainer class="map-container" [class.map-hidden]="isMapLoading() || hasMapError()"></div>
  
  <div class="map-controls" *ngIf="map && !hasMapError()">
    <button class="map-btn" (click)="zoomIn()" aria-label="Zoom in">+</button>
    <button class="map-btn" (click)="zoomOut()" aria-label="Zoom out">−</button>
  </div>
</div>
