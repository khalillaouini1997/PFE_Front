<div class="map-wrapper">
  @if (isMapLoading()) {
    <div class="map-loading">
      <div class="map-loading-spinner"></div>
      <p>Loading map...</p>
    </div>
  }

  @if (hasMapError()) {
    <div class="map-error">
      <div class="map-error-icon">
        <i class="material-icons">map</i>
      </div>
      <h3>Map Unavailable</h3>
      <p>{{ mapError() }}</p>
      <button (click)="retryMapLoad()" class="map-retry-btn" type="button">
        <i class="material-icons">refresh</i>
        <span>Retry</span>
      </button>
    </div>
  }

  <div #mapContainer [class.map-hidden]="isMapLoading() || hasMapError()" class="map-container"></div>

  <div *ngIf="map && !hasMapError()" class="map-controls">
    <button (click)="zoomIn()" aria-label="Zoom in" class="map-btn">+</button>
    <button (click)="zoomOut()" aria-label="Zoom out" class="map-btn">−</button>
  </div>
</div>
