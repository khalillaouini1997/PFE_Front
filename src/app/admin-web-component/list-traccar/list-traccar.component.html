<div class="main-panel p-4">
    <div class="premium-card mb-4 header-gradient shadow-sm p-4">
        <div class="row align-items-center">
            <div class="col-sm-6">
                <h4 class="title text-white m-0 fw-bold"><i class="fa fa-server me-2"></i> Liste des Trracars</h4>
                <p class="m-0 text-white-50 small opacity-75">Gestion des instances Traccar</p>
            </div>
            <div class="col-sm-6">
                <form [formGroup]="searchForm" (ngSubmit)="searchWebAccount()" class="d-flex justify-content-end gap-2">
                    <div class="input-group input-group-sm w-auto">
                        <input type="text" class="form-control border-0 shadow-sm px-3 bg-white bg-opacity-10 text-white search-input-fancy" 
                            formControlName="keyWord" placeholder="Rechercher...">
                        <button class="btn btn-glass px-3 border-0" type="submit" title="Rechercher">
                            <i class="fa fa-search"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="premium-card p-0 overflow-hidden shadow-sm">
        <p-table [value]="traccarDtos" [paginator]="true" [rows]="15" 
            [globalFilterFields]="['name', 'imei']"
            [rowsPerPageOptions]="[10,15,30,50]"
            styleClass="p-datatable-sm p-datatable-gridlines premium-table-custom"
            responsiveLayout="scroll">
            
            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="id" style="width: 100px">ID <p-sortIcon field="id"></p-sortIcon></th>
                    <th pSortableColumn="name">Nom <p-sortIcon field="name"></p-sortIcon></th>
                    <th pSortableColumn="imei">IMEI <p-sortIcon field="imei"></p-sortIcon></th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-trac>
                <tr class="align-middle">
                    <td><span class="badge bg-light text-dark">{{trac.id}}</span></td>
                    <td class="fw-bold">{{trac.name}}</td>
                    <td><code>{{trac.imei}}</code></td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="3" class="text-center py-5 text-secondary">
                        <i class="fa fa-search fa-3x opacity-25 mb-2"></i>
                        <p>Aucun Traccar trouvé</p>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
