<div class="main-panel p-4">
  <app-page-header subtitleKey="IP_ADDRESS.ADD_SUBTITLE" titleKey="IP_ADDRESS.ADD_TITLE">
    <button class="btn btn-glass btn-sm rounded-circle" routerLink="/adminWeb/listIps"
            title="{{ 'COMMON.BACK' | translate }}">
      <i class="fa fa-arrow-left text-white"></i>
    </button>
  </app-page-header>

  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="premium-card shadow-sm p-4">
        <form [formGroup]="ipForm">
          <div class="row g-3">
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="label" id="ipLabel" placeholder="{{ 'IP_ADDRESS.LABEL_NAME' | translate }}"
                       type="text">
                <label for="ipLabel">{{ 'IP_ADDRESS.LABEL_NAME' | translate }}</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="value" id="ipValue" placeholder="{{ 'IP_ADDRESS.IP_VALUE' | translate }}"
                       type="text">
                <label for="ipValue">{{ 'IP_ADDRESS.IP_VALUE' | translate }}</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="jdbcUser" id="jdbcUser" placeholder="{{ 'IP_ADDRESS.JDBC_USER' | translate }}"
                       type="text">
                <label for="jdbcUser">{{ 'IP_ADDRESS.JDBC_USER' | translate }}</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="jdbcPass" id="jdbcPass" placeholder="{{ 'IP_ADDRESS.JDBC_PASS' | translate }}"
                       type="password">
                <label for="jdbcPass">{{ 'IP_ADDRESS.JDBC_PASS' | translate }}</label>
              </div>
            </div>
            <div class="col-md-12">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="url" id="ipUrl" placeholder="{{ 'IP_ADDRESS.CONN_URL' | translate }}"
                       type="text">
                <label for="ipUrl">{{ 'IP_ADDRESS.CONN_URL' | translate }}</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <select class="form-select border-0" formControlName="typeConnection"
                        id="typeConnection" style="background: var(--surface-elevated); color: var(--text-primary);"
                        title="{{ 'IP_ADDRESS.CONN_TYPE' | translate }}">
                  @for (type of typeConnection; track type.type) {
                    <option [value]="type.type">{{ type.type }}</option>
                  }
                </select>
                <label for="typeConnection">{{ 'IP_ADDRESS.CONN_TYPE' | translate }}</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="dbName" id="dbName" placeholder="{{ 'IP_ADDRESS.DB_NAME_INPUT' | translate }}"
                       type="text">
                <label for="dbName">{{ 'IP_ADDRESS.DB_NAME_INPUT' | translate }}</label>
              </div>
            </div>
          </div>

          <div class="mt-4 pt-3 d-flex justify-content-end gap-3">
            <button class="btn btn-light px-4 btn-cancel-premium" routerLink="/adminWeb/listIps"
                    type="button">{{ 'COMMON.CANCEL' | translate }}
            </button>
            <button (click)="saveIpAddres()" [disabled]="ipForm.invalid"
                    class="btn btn-primary px-5 fw-bold shadow-sm btn-save-premium" type="button">
              <i class="fa fa-save me-2"></i> {{ 'IP_ADDRESS.SAVE_IP' | translate }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
