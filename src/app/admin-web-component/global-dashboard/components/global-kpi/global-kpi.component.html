<div class="kpi-grid">
  <app-kpi-card
    [label]="'GLOBAL_DASHBOARD.TOTAL_FLEET' | translate"
    [showSparkline]="false"
    [value]="stats().totalVehicles"
    icon="🚗"
  ></app-kpi-card>
  <app-kpi-card
    [label]="'GLOBAL_DASHBOARD.ACTIVE_FLEET' | translate"
    [showSparkline]="false"
    [value]="stats().moving"
    icon="🟢"
  ></app-kpi-card>
  <app-kpi-card
    [label]="'GLOBAL_DASHBOARD.STOPPED_FLEET' | translate"
    [showSparkline]="false"
    [value]="stats().stopped"
    icon="🔴"
  ></app-kpi-card>
  <app-kpi-card
    [label]="'GLOBAL_DASHBOARD.INACTIVE_FLEET' | translate"
    [showSparkline]="false"
    [value]="stats().inactive"
    icon="⚪"
  ></app-kpi-card>
  <app-kpi-card
    [label]="'GLOBAL_DASHBOARD.VALID_STATUS' | translate"
    [showSparkline]="false"
    [value]="stats().valid"
    icon="✅"
  ></app-kpi-card>
  <app-kpi-card
    [label]="'GLOBAL_DASHBOARD.TECHNICAL_ISSUES' | translate"
    [showSparkline]="false"
    [value]="stats().technicalIssue"
    icon="⚠️"
  ></app-kpi-card>
  <app-kpi-card
    [label]="'GLOBAL_DASHBOARD.TOTAL_ACCOUNTS' | translate"
    [showSparkline]="false"
    [value]="stats().accountsCount"
    icon="🏢"
  ></app-kpi-card>
</div>
