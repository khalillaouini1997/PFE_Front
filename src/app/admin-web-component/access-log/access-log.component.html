<div class="main-panel p-4">
    <!-- Header Section -->
    <div class="premium-card mb-4 header-gradient shadow-sm p-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="title-section text-white">
                <h2 class="m-0 fw-bold">Journal d'Accès</h2>
                <p class="m-0 text-white-50 opacity-75">Suivi en temps réel des connexions et de la sécurité</p>
            </div>
            
            <div class="controls-section d-flex align-items-center gap-3">
                <form class="d-flex align-items-center" [formGroup]="searchForm" (ngSubmit)="searchAccess()">
                    <div class="input-group shadow-sm search-group-premium">
                        <input type="text" class="form-control border-0 px-3 search-input-premium bg-white bg-opacity-10 text-white" 
                            formControlName="keyWord" placeholder="Rechercher par login..." title="Rechercher par login">
                        <button class="btn btn-glass border-0" type="submit" title="Lancer la recherche">
                            <i class="fa fa-search"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Table Section -->
    <div class="premium-card p-0 overflow-hidden shadow-sm">
        <p-table [value]="accessLogs" [lazy]="true" (onLazyLoad)="pageChanged($event)" 
            [paginator]="true" [rows]="itemsPerPage" [totalRecords]="bigTotalItems" 
            [rowsPerPageOptions]="[10,15,30,50]"
            [loading]="loading"
            stateStorage="session" stateKey="access-logs-state"
            [reorderableColumns]="true" [resizableColumns]="true" columnResizeMode="expand"
            styleClass="p-datatable-sm p-datatable-gridlines premium-table-custom"
            responsiveLayout="scroll">
            
            <ng-template pTemplate="header">
                <tr>
                    <th class="col-user" pReorderableColumn pResizableColumn>Utilisateur Access</th>
                    <th class="col-date" pReorderableColumn pResizableColumn>Date & Heure</th>
                    <th class="col-ip" pReorderableColumn pResizableColumn>Adresse IP</th>
                    <th class="col-agent" pReorderableColumn pResizableColumn>Navigateur / Agent</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-access>
                <tr class="align-middle border-bottom border-light">
                    <td class="fw-bold text-primary">{{access.login}}</td>
                    <td>
                        <div class="fw-bold text-dark">{{access.date | date:'dd MMM yyyy'}}</div>
                        <div class="small text-secondary">{{access.date | date:'HH:mm:ss'}}</div>
                    </td>
                    <td><span class="badge bg-light text-dark fw-bold border">{{access.ipAddress}}</span></td>
                    <td><small class="text-secondary font-monospace d-block text-truncate agent-text-trunc" title="{{access.agent}}">{{access.agent}}</small></td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="4" class="text-center py-5 text-secondary">
                        <i class="fa fa-history fa-3x opacity-25 mb-2"></i>
                        <p>Aucun journal d'accès trouvé</p>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
