<div class="main-panel p-4">
    <!-- Header Section -->
    <div class="premium-card mb-4 header-gradient shadow-sm p-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="title-section text-white">
                <h2 class="m-0 fw-bold">Nouveau Compte Web</h2>
                <p class="m-0 text-white-50 opacity-75">Créer un portail client personnalisé</p>
            </div>
            <button class="btn btn-glass btn-sm rounded-circle" routerLink="/adminWeb/listWebs" title="Retour à la liste">
                <i class="fa fa-arrow-left text-white"></i>
            </button>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-12">
            <div class="premium-card shadow-sm p-4 border-0 bg-white">
                <form [formGroup]="webForm">
                    <!-- Section 1: Authentification -->
                    <h5 class="fw-bold mb-4 border-bottom pb-2 d-flex align-items-center">
                        <i class="material-icons me-2 text-primary">vpn_key</i>
                        Authentification
                    </h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="form-group mb-3 custom-form-group">
                                <label for="login" class="premium-label">Login Client</label>
                                <input type="text" class="form-control premium-input" formControlName="login" id="login" placeholder="Login">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-3 custom-form-group">
                                <label for="password" class="premium-label">Mot de passe</label>
                                <input type="text" class="form-control premium-input" formControlName="password" id="password" placeholder="Password">
                            </div>
                        </div>
                    </div>

                    <!-- Section 2: Infrastructure -->
                    <h5 class="fw-bold mt-4 mb-4 border-bottom pb-2 d-flex align-items-center">
                        <i class="material-icons me-2 text-primary">dns</i>
                        Infrastructure
                    </h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="form-group mb-3 custom-form-group">
                                <label for="idCompte" class="premium-label">Compte Serveur</label>
                                <select formControlName="idCompte" class="form-select premium-input" id="idCompte" title="Compte Serveur">
                                    @for (server of serverAccounts(); track server.idCompteClientServer) {
                                        <option [value]="server.idCompteClientServer">{{server.pseudo}}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-3 custom-form-group">
                                <label for="ipAdresse" class="premium-label">IP Adresse</label>
                                <select formControlName="ipAdresse" class="form-select premium-input" id="ipAdresse" title="IP Adresse">
                                    @for (ip of ipAddresses(); track ip.idIpAdresse) {
                                        <option [value]="ip.value">{{ ip.label }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-3 custom-form-group">
                                <label for="code_pays" class="premium-label">Code Pays</label>
                                <select formControlName="code_pays" class="form-select premium-input" id="code_pays" title="Code Pays">
                                    @for (codePays of codesPays(); track codePays.value) {
                                        <option [value]="codePays.value">{{codePays.key}} (+{{codePays.value}})</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-3 custom-datepicker-container">
                                <label for="expDate" class="p-datepicker-label">Date d'expiration</label>
                                <p-datepicker formControlName="date_expiration" id="expDate" 
                                    dateFormat="dd-mm-yy" [showIcon]="true" appendTo="body"
                                    styleClass="w-100" inputStyleClass="form-control premium-datepicker-input">
                                </p-datepicker>
                            </div>
                        </div>
                    </div>

                    <!-- Section 3: Profil & Contact -->
                    <h5 class="fw-bold mt-4 mb-4 border-bottom pb-2 d-flex align-items-center">
                        <i class="material-icons me-2 text-primary">account_circle</i>
                        Profil & Contact
                    </h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="form-group mb-3 custom-form-group">
                                <label for="firstname" class="premium-label">Nom</label>
                                <input type="text" class="form-control premium-input" formControlName="firstname" id="firstname" placeholder="Nom">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-3 custom-form-group">
                                <label for="lastname" class="premium-label">Prénom</label>
                                <input type="text" class="form-control premium-input" formControlName="lastname" id="lastname" placeholder="Prénom">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-3 custom-form-group">
                                <label for="email" class="premium-label">Email</label>
                                <input type="email" class="form-control premium-input" formControlName="email" id="email" placeholder="Email">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-3 custom-form-group">
                                <label for="telephone" class="premium-label">Téléphone</label>
                                <input type="tel" class="form-control premium-input" formControlName="telephone" id="telephone" placeholder="Tel">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group mb-3 custom-form-group">
                                <label for="area" class="premium-label">Région / Territoire</label>
                                <select formControlName="area" class="form-select premium-input" id="area" title="Région / Territoire">
                                    @for (t of regions; track t) {
                                        <option [value]="t">{{ t }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-3 custom-form-group">
                                <label for="notif" class="premium-label">Type de Notification</label>
                                <select formControlName="notificationSubquery" class="form-select premium-input" id="notif" title="Type de Notification">
                                    @for (notifSub of notifSubs; track notifSub) {
                                        <option [value]="notifSub">{{ notifSub }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <div class="form-group mb-3 custom-form-group d-flex flex-column align-items-center">
                                <label for="mobileNotif" class="premium-label">Mobile</label>
                                <div class="form-check form-switch p-0 d-flex align-items-center mobile-toggle-container">
                                    <input class="form-check-input ms-0 mobile-toggle" type="checkbox" formControlName="mobileNotif" id="mobileNotif" title="Activer notifications mobile">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Section 4: Facturation -->
                    <h5 class="fw-bold mt-4 mb-4 border-bottom pb-2 d-flex align-items-center">
                        <i class="material-icons me-2 text-primary">receipt_long</i>
                        Paramètres de Facturation
                    </h5>
                    <div class="row g-3">
                        <div class="col-md-3">
                            <div class="form-group mb-3 custom-form-group">
                                <label for="feeDay" class="premium-label">Redev. Equip. / Jour</label>
                                <input type="number" class="form-control premium-input" formControlName="deviceFeeByDay" id="feeDay" placeholder="0">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group mb-3 custom-form-group">
                                <label for="accMonth" class="premium-label">Redev. Compte / Mois</label>
                                <input type="number" class="form-control premium-input" formControlName="accountFeeByMonth" id="accMonth" placeholder="0">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group mb-3 custom-form-group">
                                <label for="devMonth" class="premium-label">Redev. Equip. / Mois</label>
                                <input type="number" class="form-control premium-input" formControlName="deviceFeePerMonth" id="devMonth" placeholder="0">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group mb-3 custom-form-group">
                                <label for="simMonth" class="premium-label">Redev. SIM / Mois</label>
                                <input type="number" class="form-control premium-input" formControlName="simCardFeePerMonth" id="simMonth" placeholder="0">
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 d-flex justify-content-end gap-3">
                        <button type="button" class="btn btn-light px-4 btn-cancel-premium" routerLink="/adminWeb/listWebs">Annuler</button>
                        <button type="button" class="btn btn-primary px-5 fw-bold shadow-sm btn-save-premium" [disabled]="webForm.invalid" (click)="addCompteWeb()">
                           <i class="fa fa-save me-2"></i> Enregistrer le Compte Web
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
