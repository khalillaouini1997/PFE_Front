<div class="speed-leaders-container">
  <div class="speed-leaders-card">
    <h3>🏆 Top Speed Leaders</h3>
    @if (topSpeedVehicles().length === 0) {
      <div class="no-data">No moving vehicles</div>
    } @else {
      <div class="speed-table">
        @for (vehicle of topSpeedVehicles(); track vehicle.deviceid) {
          <div class="speed-row">
            <div class="vehicle-info">
              <span class="matricule">{{ vehicle.matricule }}</span>
              <span class="device-id">ID: {{ vehicle.deviceid }}</span>
            </div>
            <div class="speed-info">
              <span class="speed-value" [style.color]="getSpeedColor(vehicle.speed)">
                {{ vehicle.speed }} km/h
              </span>
              <span class="status-badge" [ngClass]="{
                'status-valid': vehicle.status === 'VALID',
                'status-issue': vehicle.status === 'TECHNICAL_ISSUE',
                'status-non-valid': vehicle.status === 'NON_VALID'
              }">
                {{ vehicle.status }}
              </span>
            </div>
          </div>
        }
      </div>
    }
  </div>
</div>
