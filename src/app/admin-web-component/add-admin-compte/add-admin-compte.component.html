<div class="main-panel p-4">
  <app-page-header subtitleKey="ADMIN_ACCOUNTS.ADD_SUBTITLE" titleKey="ADMIN_ACCOUNTS.ADD_TITLE">
    <button class="btn btn-glass btn-sm rounded-circle" routerLink="/adminWeb/adminCompte"
            title="{{ 'COMMON.BACK_TO_LIST' | translate }}">
      <i class="fa fa-arrow-left text-white"></i>
    </button>
  </app-page-header>

  @if (mode) {
    <div class="alert alert-danger border-0 shadow-sm mb-4 fade-in" role="alert">
      <i class="fa fa-exclamation-circle me-2"></i> {{ messageError }}
    </div>
  }

  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="premium-card shadow-sm">
        <form [formGroup]="adminForm" class="p-2">
          <h5 class="fw-bold mb-4 border-bottom pb-2"><i
            class="fa fa-id-card me-2 text-primary"></i> {{ 'ADMIN_ACCOUNTS.ID_ROLE' | translate }}</h5>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="username">{{ 'AUTH.USERNAME' | translate }}</label>
              <input class="form-control" formControlName="username" id="username" type="text">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="password">{{ 'AUTH.PASSWORD' | translate }}</label>
              <input class="form-control" formControlName="password" id="password" type="text">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="role">{{ 'ADMIN_ACCOUNTS.ASSIGNED_ROLE' | translate }}</label>
              <select class="form-select" formControlName="role" id="role"
                      style="background: var(--surface-elevated); color: var(--text-primary);">
                @for (r of roles; track r) {
                  <option [value]="r">{{ r }}</option>
                }
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="idTraccar">{{ 'ADMIN_ACCOUNTS.TRACCAR_ID_OPTIONAL' | translate }}</label>
              <input class="form-control" formControlName="idTraccar" id="idTraccar" type="number">
            </div>
          </div>

          <h5 class="fw-bold mt-4 mb-4 border-bottom pb-2"><i
            class="fa fa-bell me-2 text-primary"></i> {{ 'ADMIN_ACCOUNTS.NOTIF_SUPPORT' | translate }}</h5>

          <div class="row g-3 align-items-stretch">
            <div class="col-md-6">
              <div class="premium-card border-0 shadow-none d-flex align-items-center justify-content-between p-3 h-100"
                   style="background: var(--surface-elevated);">
                <label class="fw-medium mb-0" for="useFcm">{{ 'ADMIN_ACCOUNTS.ENABLE_FCM' | translate }}</label>
                <div class="form-check form-switch p-0">
                  <input class="form-check-input ms-0 scale-125" formControlName="useFcm" id="useFcm"
                         type="checkbox">
                </div>
              </div>
            </div>
            <div class="col-md-6 d-flex flex-column">
              <label class="form-label" for="fcmPrefix">{{ 'ADMIN_ACCOUNTS.FCM_PREFIX' | translate }}</label>
              <input class="form-control flex-grow-1" formControlName="fcmPrefix" id="fcmPrefix" type="text">
            </div>
            <div class="col-md-12">
              <label class="form-label" for="mailSupport">{{ 'ADMIN_ACCOUNTS.SUPPORT_EMAIL' | translate }}</label>
              <input class="form-control" formControlName="mailSupport" id="mailSupport" type="email">
            </div>
          </div>

          <h5 class="fw-bold mt-4 mb-4 border-bottom pb-2"><i
            class="fa fa-money-bill-wave me-2 text-primary"></i> {{ 'ADMIN_ACCOUNTS.FINANCIAL_SETTINGS' | translate }}
          </h5>

          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label" for="deviceCostByDay">{{ 'ADMIN_ACCOUNTS.DEVICE_COST_DAY' | translate }}</label>
              <input class="form-control" formControlName="deviceCostByDay" id="deviceCostByDay" type="text">
            </div>
            <div class="col-md-4">
              <label class="form-label" for="accountFreePerMonth">{{ 'ADMIN_ACCOUNTS.FREE_ACCOUNTS_MONTH' | translate }}</label>
              <input class="form-control" formControlName="accountFreePerMonth" id="accountFreePerMonth" type="number">
            </div>
            <div class="col-md-4">
              <label class="form-label" for="transctionFee">{{ 'ADMIN_ACCOUNTS.TRANSACTION_FEE' | translate }}</label>
              <input class="form-control" formControlName="transctionFee" id="transctionFee" type="text">
            </div>
          </div>

          <div class="mt-4 pt-3 d-flex justify-content-end gap-3">
            <button class="btn btn-light px-4 btn-cancel-premium" routerLink="/adminWeb/adminCompte"
                    type="button">{{ 'COMMON.CANCEL' | translate }}
            </button>
            <button (click)="addAdminCompte()" [disabled]="adminForm.invalid" class="btn btn-primary px-5 fw-bold btn-save-premium"
                    type="button">
              <i class="fa fa-save me-2"></i> {{ 'ADMIN_ACCOUNTS.SAVE_ADMIN' | translate }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
