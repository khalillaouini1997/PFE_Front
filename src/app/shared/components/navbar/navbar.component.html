<nav class="navbar">
  <div class="navbar-brand">
    <span class="navbar-title">PFE Admin</span>
  </div>

  <div class="navbar-actions">
    <div class="language-switcher">
      <button
        (click)="changeLanguage('fr')"
        [class.active]="isLang('fr')"
        [class.inactive]="!isLang('fr')"
        class="lang-btn">
        FR
      </button>
      <button
        (click)="changeLanguage('en')"
        [class.active]="isLang('en')"
        [class.inactive]="!isLang('en')"
        class="lang-btn">
        EN
      </button>
    </div>
  </div>
</nav>
