@if (isVisible()) {
  <div
    (keydown)="onKeydown($event)"
    [class.severity-error]="getSeverity() === 'error'"
    [class.severity-info]="getSeverity() === 'info'"
    [class.severity-warning]="getSeverity() === 'warning'"
    aria-live="assertive"
    class="error-banner"
    role="alert"
    tabindex="-1"
  >
    <div class="error-banner-content">
      <div class="error-banner-icon">
        <i class="material-icons">{{ getIcon() }}</i>
      </div>
      <div class="error-banner-message">
        <p class="error-banner-text">{{ error()?.message }}</p>
      </div>
      <div class="error-banner-actions">
        @if (error()?.retryAction) {
          <button
            (click)="onRetry()"
            aria-label="Retry"
            class="error-banner-btn retry-btn"
            type="button"
          >
            <i class="material-icons">refresh</i>
            <span>Retry</span>
          </button>
        }
        @if (error()?.dismissible !== false) {
          <button
            (click)="dismiss()"
            aria-label="Dismiss"
            class="error-banner-btn dismiss-btn"
            type="button"
          >
            <i class="material-icons">close</i>
          </button>
        }
      </div>
    </div>
  </div>
}
