<div class="kpi-card" [class.trend-up]="trend() === 'up'" [class.trend-down]="trend() === 'down'">
  <div class="kpi-header">
    <span class="kpi-icon">{{ icon() }}</span>
    <span class="kpi-trend" *ngIf="trend()">
      {{ trend() === 'up' ? '↑' : '↓' }} {{ trendValue() }}%
    </span>
  </div>
  <div class="kpi-value">{{ value() }}</div>
  <div class="kpi-label">{{ label() }}</div>
  <canvas #sparkline *ngIf="showSparkline" class="sparkline"></canvas>
</div>
