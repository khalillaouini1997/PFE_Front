<div [class.trend-down]="trend() === 'down'" [class.trend-up]="trend() === 'up'" class="kpi-card">
  <div class="kpi-header">
    <span class="kpi-icon">{{ icon() }}</span>
    <span *ngIf="trend()" class="kpi-trend">
      {{ trend() === 'up' ? '↑' : '↓' }} {{ trendValue() }}%
    </span>
  </div>
  <div class="kpi-value">{{ displayValue() }}</div>
  <div class="kpi-label">{{ label() }}</div>
  <div *ngIf="showSparkline()" class="sparkline-container">
    <canvas #sparkline class="sparkline"></canvas>
  </div>
</div>
