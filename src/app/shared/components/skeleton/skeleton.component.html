@for (i of count(); track i) {
  <div 
    class="skeleton skeleton-{{ variant() }}" 
    [class]="className()"
    [style.width]="variant() === 'text' || variant() === 'rectangular' ? width() : null"
    [style.height]="typeof height() === 'number' ? height() + 'px' : height()"
  >
    @if (variant() === 'text') {
      @for (line of lines(); track line) {
        <div class="skeleton-line" [style.width]="line === lines() ? '70%' : '100%'"></div>
      }
    }
    @if (variant() === 'card') {
      <div class="skeleton-card-header">
        <div class="skeleton skeleton-circular" style="width: 48px; height: 48px;"></div>
        <div class="skeleton-card-title">
          <div class="skeleton-line" style="width: 60%;"></div>
          <div class="skeleton-line" style="width: 40%;"></div>
        </div>
      </div>
      <div class="skeleton-card-body">
        <div class="skeleton-line"></div>
        <div class="skeleton-line" style="width: 80%;"></div>
      </div>
    }
    @if (variant() === 'table-row') {
      <div class="skeleton-table-row">
        <div class="skeleton skeleton-rectangular" style="width: 10%;"></div>
        <div class="skeleton skeleton-rectangular" style="width: 20%;"></div>
        <div class="skeleton skeleton-rectangular" style="width: 15%;"></div>
        <div class="skeleton skeleton-rectangular" style="width: 15%;"></div>
        <div class="skeleton skeleton-rectangular" style="width: 10%;"></div>
        <div class="skeleton skeleton-rectangular" style="width: 10%;"></div>
        <div class="skeleton skeleton-rectangular" style="width: 20%;"></div>
      </div>
    }
  </div>
}
