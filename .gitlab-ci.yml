stages:
  - quality
  - docker

variables:
  IMAGE_NAME: registry.gitlab.com/$CI_PROJECT_PATH
  GIT_DEPTH: 0
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  TRIVY_VERSION: "0.36.0"

# ──────────────────────────────────────────────
# Job 1: Lint + Test
# ──────────────────────────────────────────────
lint-test:
  stage: quality
  image: node:24-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}-npm
    paths:
      - .npm/
  script:
    - npm ci --legacy-peer-deps --prefer-offline
    - npm run lint
    - npx ng test --coverage --watch=false
    - npm audit --audit-level=high || true
  artifacts:
    paths:
      - coverage/
      - node_modules/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success

# ──────────────────────────────────────────────
# Job 2: SonarCloud Analysis
# ──────────────────────────────────────────────
sonarcloud:
  stage: quality
  image: node:24-alpine
  needs:
    - job: lint-test
      artifacts: true
  script:
    - npx sonarqube-scanner
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.projectKey=khalillaouini1997_pfe-frontend
      -Dsonar.organization=khalillaouini1997
      -Dsonar.host.url=https://sonarcloud.io
      -Dsonar.sources=src
      -Dsonar.exclusions=**/node_modules/**,**/test/**,**/*.spec.ts,**/main.ts,**/polyfills.ts,**/test-setup.ts,**/test-providers.ts,**/app.routes.ts,**/admin-web-component.routes.ts,**/environments/**,**/utils/operators.ts
      -Dsonar.javascript.lcov.reportPaths=coverage/web_admin/lcov.info
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success

# ──────────────────────────────────────────────
# Job 3: Docker Build, Trivy Scan & Push
# ──────────────────────────────────────────────
docker:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  needs:
    - job: lint-test
      artifacts: false
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v${TRIVY_VERSION}
  script:
    - docker pull $IMAGE_NAME:latest || true
    - docker build --cache-from $IMAGE_NAME:latest -t $IMAGE_NAME:latest -t $IMAGE_NAME:$CI_COMMIT_SHA .

    # Trivy vulnerability scan — human-readable table (non-blocking)
    - trivy image --exit-code 0 --severity CRITICAL,HIGH --format table $IMAGE_NAME:latest

    # Trivy SARIF report (for GitLab Security Dashboard / artifact)
    - trivy image --exit-code 0 --severity CRITICAL,HIGH --format template --template "@/contrib/gitlab.tpl" -o gl-container-scanning-report.json $IMAGE_NAME:latest || true

    - docker push $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:$CI_COMMIT_SHA
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json
    when: always
    expire_in: 3 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success